<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CNSC Member Activity Radar</title>
<meta name="description" content="Weekly radar of what the members of the Czech National Semiconductor Cluster publish: products, investments, projects, events, partnerships and awards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* CNSC brand: cleanroom light, brand blue #0066B5 (from the member catalogue); dark theme is its own set of steps */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --panel2:#F6F8FA; --ink:#10161D; --muted:#5A6672; --faint:#8A96A3; --line:#D6DCE2; --line2:#E6EAEE;
  --blue:#0066B5; --blue-deep:#004C86; --blue-soft:#E3EEF8; --chip:#101820; --chip-ink:#E8EDF2; --chip-line:rgba(255,255,255,.16);
  --ring1:#0066B5; --ring2:#4A86C5; --ring3:#9DB7D3; --ring4:#C9D1D9; --warn:#B45309; --warn-bg:#FFF4E0;
  --seg-design:#0066B5; --seg-materials:#D97706; --seg-fab:#0D9488; --seg-equipment:#7C3AED; --seg-test:#DB2777; --seg-apps:#65A30D; --seg-research:#B91C1C; --seg-eco:#16A34A;
  --shadow:0 12px 30px -18px rgba(20,80,143,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --panel:#161D27; --panel2:#1B2330; --ink:#E8EDF2; --muted:#A5AFBC; --faint:#6F7A89; --line:#2A3441; --line2:#222B37;
  --blue:#3B8FD9; --blue-deep:#6FAEE8; --blue-soft:#1A2A3D; --chip:#0B1017; --chip-ink:#E8EDF2; --chip-line:rgba(255,255,255,.14);
  --ring1:#3B8FD9; --ring2:#2F6AA3; --ring3:#2A4866; --ring4:#273140; --warn:#F2B35A; --warn-bg:#2A2110;
  --seg-design:#3B8FD9; --seg-materials:#D97706; --seg-fab:#0D9488; --seg-equipment:#8B5CF6; --seg-test:#EC4899; --seg-apps:#65A30D; --seg-research:#C2410C; --seg-eco:#16A34A;
  --shadow:0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --panel:#161D27; --panel2:#1B2330; --ink:#E8EDF2; --muted:#A5AFBC; --faint:#6F7A89; --line:#2A3441; --line2:#222B37;
  --blue:#3B8FD9; --blue-deep:#6FAEE8; --blue-soft:#1A2A3D; --chip:#0B1017; --chip-ink:#E8EDF2; --chip-line:rgba(255,255,255,.14);
  --ring1:#3B8FD9; --ring2:#2F6AA3; --ring3:#2A4866; --ring4:#273140; --warn:#F2B35A; --warn-bg:#2A2110;
  --seg-design:#3B8FD9; --seg-materials:#D97706; --seg-fab:#0D9488; --seg-equipment:#8B5CF6; --seg-test:#EC4899; --seg-apps:#65A30D; --seg-research:#C2410C; --seg-eco:#16A34A;
  --shadow:0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;font-size:15px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
a{color:var(--blue)}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;text-wrap:balance;letter-spacing:-.01em}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 0 10px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);align-items:center}
.strip b{color:var(--ink);font-weight:600}
.strip .sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:5px 11px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--blue);color:#fff}
.hero{padding:18px 0 4px;display:grid;grid-template-columns:1fr auto;gap:12px 32px;align-items:end}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.eyebrow::before{content:"";width:30px;height:2px;background:var(--blue)}
h1{font-weight:700;font-size:clamp(24px,3.4vw,38px);line-height:1.1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 #h1t{white-space:nowrap}
h1 .alpha{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:4px 8px;font-weight:600;line-height:1.2}
h1 .fb{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);border:1px solid var(--blue);border-radius:6px;padding:4px 10px;font-weight:600;text-decoration:none;white-space:nowrap;line-height:1.2}
h1 .fb:hover{background:var(--blue);color:#fff}
.lede{max-width:none;margin-top:8px;font-size:16px;color:var(--muted)}
.logo{height:64px;width:auto;display:block;justify-self:end}
.banner{margin:18px 0 6px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tabs a.ext{font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;margin-bottom:-1px;margin-left:auto}
.tabs a.ext:hover{color:var(--blue)}
.panel{display:none;padding:16px 0 28px}
.panel.on{display:block}
h2{font-size:22px;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);max-width:none;margin-bottom:12px}
.fine{font-size:12.5px;color:var(--muted);max-width:80ch}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:2px 0 14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 9px;min-width:0}
.st .v{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st .l{margin-top:6px;font-weight:600;font-size:14px;line-height:1.3}
.st .s{margin-top:4px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);line-height:1.4}
/* radar */
.radarwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,.7fr);gap:16px;align-items:start}
.radar{background:var(--chip);border-radius:16px;padding:12px;position:relative;box-shadow:0 24px 60px -28px rgba(12,24,38,.45)}
.radar svg{display:block;width:100%;height:auto}
.key{display:flex;flex-direction:column;gap:7px}
.rk{border-left:3px solid var(--c);padding:6px 0 6px 12px;background:var(--panel);border-radius:0 8px 8px 0}
.rk .n{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rk .t{font-weight:600;font-size:15px}
.rk .w{font-size:12.5px;color:var(--muted);margin-top:2px}
.seglist{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:4px}
.centre{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:10px;padding:12px 16px 11px;margin-bottom:10px}
.centre .ch{display:flex;justify-content:space-between;gap:12px 20px;align-items:flex-start;flex-wrap:wrap}
.centre h3{font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.centre .kind{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-top:3px}
.centre .links{display:flex;gap:14px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12px}
.centre .lead{font-size:13.5px;margin-top:10px}
.centre .lead .ln{color:var(--muted)}
.centre p{font-size:14px;color:var(--ink);margin:8px 0 0;max-width:78ch}
.centre .facts{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.centre h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;display:flex;gap:10px;align-items:baseline}
.centre h4 .cnt{font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint)}
.centre .parts{display:flex;flex-wrap:wrap;gap:6px 8px}
.centre .cp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--bg)}
.centre .cp i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;flex:0 0 auto}
.centre .cp.m{border-color:var(--c);color:var(--ink)}
.centre .cp.m i{background:var(--c);border-color:var(--c)}
.centre .cp em{font-style:normal;color:var(--muted);font-size:11.5px}
.centre .item{padding-top:6px}
.centre .csrc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-top:10px;line-height:1.5}
.centre .csrc a{color:var(--muted)}
.rk.legend{border-left-style:dashed}
.rk.legend .li{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.rk.legend .li b{color:var(--ink);font-weight:600}
.rk.legend .seglist{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2)}
.seglist i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.35;box-shadow:var(--shadow);max-width:260px;display:none;z-index:5}
.tip b{display:block;font-family:"Space Grotesk",sans-serif;font-size:14px}
.tip .m{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
/* top list */
.top{margin-top:26px}
.item{display:grid;grid-template-columns:92px 1fr;gap:2px 16px;padding:7px 0;border-bottom:1px solid var(--line2)}
.item .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.item .t{font-size:14.5px}
.item .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--panel);text-decoration:none}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.chip.ty{background:var(--blue-soft);border-color:transparent;color:var(--ink)}
.chip.src{color:var(--muted)}
.item .t a{color:var(--blue)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.filters button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.filters button:disabled{opacity:.45;cursor:not-allowed}
.filters button .n{font-size:11px;opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
.filters .lb{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 2px 0 4px}
.filters .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.count{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.count b{color:var(--ink);font-weight:600}
.count a{color:var(--blue)}
.empty{padding:16px 0;color:var(--muted)}
/* members */
.stage{margin:16px 0 4px}
.stage-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
.stage-head .code{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--c)}
.stage-head h3{font-size:19px;font-weight:600}
.stage-head .sc{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:3px solid var(--c)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h4{font-size:15.5px;font-weight:600;line-height:1.25}
.card .city{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;color:var(--muted);white-space:nowrap;padding-top:3px}
.card p{font-size:13px;color:var(--muted);flex:1}
.card .last{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.card .last i{width:9px;height:9px;border-radius:50%;background:var(--rc);display:inline-block;flex:none}
.card .links{display:flex;gap:12px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.card .links a{text-decoration:none;border-bottom:1px solid transparent}
.card .links a:hover{border-bottom-color:var(--blue)}
.card .note{font-size:11.5px;color:var(--warn)}
.card .tr{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 8px;align-self:flex-start}
.offer{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.offer summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--blue);list-style:none;display:flex;align-items:center;gap:6px}
.offer summary::-webkit-details-marker{display:none}
.offer summary::before{content:"+";display:inline-block;width:14px;height:14px;border:1px solid var(--blue);border-radius:4px;font-size:11px;line-height:12px;text-align:center}
.offer[open] summary::before{content:"\2013"}
.offer .ob{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.offer h5{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.offer ul{padding-left:16px;margin:0;font-size:12.5px;color:var(--ink)}
.offer li{margin:2px 0}
.offer .oi{font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line2)}
.offer .oi:last-child{border-bottom:0}
.offer .oi b{font-weight:600;display:block;font-size:12.5px}
.offer .oi span{color:var(--muted);white-space:pre-line}
.offer .train{font-size:12.5px;background:var(--blue-soft);border-radius:8px;padding:6px 9px}
.offer .osrc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}
/* events */
.ev{display:grid;grid-template-columns:130px 1fr;gap:2px 16px;padding:7px 0;border-bottom:1px solid var(--line2)}
.ev .w{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink);font-weight:600}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.about h3{font-size:16px;margin:0 0 6px}
.about p,.about li{font-size:14px;color:var(--muted)}
.about ul{padding-left:18px;margin:4px 0 14px}
.about .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.about code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
footer{border-top:1px solid var(--line);padding:12px 0 28px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 22px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.radarwrap{grid-template-columns:1fr}.about{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.logo{justify-self:start;height:52px}}
@media(max-width:560px){.item,.ev{grid-template-columns:1fr}.st .v{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<div class="wrap">
  <div class="strip" id="strip"></div>
  <div class="hero">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1><span id="h1t"></span><span class="alpha" id="alphaTag"></span><a class="fb" id="fbBtn" href="mailto:cerny@semicz.eu?subject=CNSC%20Radar%20%E2%80%93%20zp%C4%9Btn%C3%A1%20vazba"></a></h1>
    </div>
    <img class="logo" alt="Czech National Semiconductor Cluster" src="https://www.semicz.cz/wp-content/uploads/2024/12/Cropped_Czech-National-Main-Logo-800x600-1.png" onerror="this.style.display='none'">
  </div>
  <p class="lede" id="lede"></p>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="panel on" id="p-overview" role="tabpanel">

    <p class="count" id="newsCount"></p>

  <section class="panel" id="p-members" role="tabpanel">

  </section>

odelling support", "Application & device modelling guidance, simulation support, design-in assistance for power management and SiC solutions."], ["Prototyping support and technical coaching", "Prototype build/evaluation support, lab characterization, coaching on power device application and qualification basics."], ["Training and awareness-raising workshops", "Workshops on power electronics / SiC technology, manufacturing basics, and design-in considerations (tailored for CNSC audience)."], ["Business development & matchmaking", "Matchmaking via CNSC channels and EU networks to connect potential customers/partners to onsemi capabilities."], ["Access to infrastructure (labs, cleanrooms, test benches)", "Access to selected characterization labs/test benches and (where possible) fab visits; not an open-access cleanroom."]], "src": ["https://investor.onsemi.com/news-releases/news-release-details/onsemi-expands-its-silicon-carbide-fab-czech-republic", "https://czechinvest.gov.cz/en/Homepage/News/June-2024/American-chip-manufacturer-onsemi-has-announced-an-investment-of-more-than-CZK-40-billion-in-the-exp", "https://www.fekt.vut.cz/en/faculty/news_new/302655", "https://www.lupa.cz/aktuality/zlinsky-kraj-se-po-jizni-morave-dostal-mezi-nejvyspelejsi-cipove-regiony-v-evrope/"]}},

m", "url": "https://www.jic.cz"}, {"n": "Czech National Semiconductor Cluster", "url": "https://www.semicz.cz", "role": {"cs": "předseda Řídicího výboru", "en": "chair of the Steering Committee"}}], "src": [["Czech Semiconductor Centre – LinkedIn", "https://www.linkedin.com/company/czech-semiconductor-centre/"], ["FEKT VUT: Czech Semiconductor Centre has been launched in Brno (7. 4. 2025)", "https://www.fekt.vut.cz/en/faculty/news_new/286667"]]},
    {"id": "s4a", "n": "Semiconductors4All", "short": "S4A", "kind": {"cs": "Národní centrum kompetence TA ČR (SIGMA, TQ28000004)", "en": "National competence centre of the Technology Agency of the Czech Republic (SIGMA, TQ28000004)"}, "lead": ["vut-brno"], "leadNote": {"cs": "koordinátor VUT (Ústav mikroelektroniky FEKT); konsorcium 19 organizací; v řídicím výboru projektu zastupuje CNSC jeho prezident Stanislav Černý (externí člen); na přípravě projektu se CNSC významně podílel", "en": "coordinated by BUT (Department of Microelectronics FEEC); consortium of 19 organisations; CNSC is represented on the project board by its President Stanislav Černý (external member); CNSC played a significant role in preparing the project"}, "url": "https://semiconductors4all.cz/", "li": "", "period": "2026–2031", "facts": {"cs": "TA ČR, program SIGMA – 13. veřejná soutěž, Centra aplikovaného výzkumu · 1/2026 – 12/2031 · rozpočet přes 500 mil. Kč · kick-off na FEKT VUT v červnu 2026 · tři výzkumné záměry VZ1–VZ3", "en": "TA ČR SIGMA programme – 13th call, Applied Research Centres · 1/2026 – 12/2031 · budget above CZK 500 million · kick-off at FEEC BUT in June 2026 · three research areas RA1–RA3"}, "cs": "Centrum aplikovaného výzkumu spojující univerzity, ústavy Akademie věd a průmysl ve třech oblastech: diagnostika, přístroje a polovodičové materiály (elektronová mikroskopie, laserové a tenkovrstvé technologie, kvantové materiály); mikroelektronika, senzory a integrované systémy (radiačně odolné součástky, detektory, AI, SoC); výkonové polovodiče, elektronika a systémy (WBG součástky a výkonové moduly). Cílem je přenos výsledků do praxe, kvalifikovaná pracovní místa a zapojení studentů.", "en": "An applied-research centre joining universities, Academy of Sciences institutes and industry in three areas: diagnostics, instrumentation and semiconductor materials (electron microscopy, laser and thin-film technologies, quantum materials); microelectronics, sensors and integrated systems (radiation-hard components, detectors, AI, SoC); power semiconductors, electronics and systems (WBG devices and power modules). It aims at transferring results into practice, skilled jobs and student involvement.", "members": [{"n": "Vysoké učení technické v Brně", "m": "vut-brno", "role": {"cs": "koordinátor", "en": "coordinator"}}, {"n": "České vysoké učení technické v Praze", "m": "cvut"}, {"n": "Univerzita Karlova – Matematicko-fyzikální fakulta", "m": "uk"}, {"n": "Masarykova univerzita", "m": "muni"}, {"n": "Západočeská univerzita v Plzni", "m": "zcu"}, {"n": "Ústav přístrojové techniky AV ČR", "m": "upt"}, {"n": "Fyzikální ústav AV ČR", "m": "fzu"}, {"n": "onsemi Czech Republic", "m": "onsemi"}, {"n": "Thermo Fisher Scientific Brno", "m": "thermo-fisher"}, {"n": "UJP Praha", "m": "ujp-praha"}, {"n": "ADVACAM", "m": "advacam"}, {"n": "CRYTUR", "m": "crytur"}, {"n": "Mycroft Mind", "m": "mycroftmind"}, {"n": "IQS nano"}, {"n": "AdvaScope"}, {"n": "NenoVision"}, {"n": "Meopta"}, {"n": "Škoda Group – ŠKODA ELECTRIC", "url": "https://www.skodagroup.com"}, {"n": "ELEKTROTECHNIKA, a.s."}], "src": [["Semiconductors4All – web projektu (konsorcium, výzkumné záměry, aktuality)", "https://semiconductors4all.cz/"], ["VUT: The Semiconductors4All project has been launched (20. 7. 2026)", "https://www.vut.cz/en/but/news-f19528/the-semiconductors4all-project-has-been-launched-czech-universities-research-organizations-and-industry-have-joined-forces-for-the-future-of-semiconductors-d349263"], ["FZÚ AV ČR: projekt Semiconductors4all (TQ28000004)", "https://www.fzu.cz/en/research/projects/semiconductors4all-semiconductors4all"]]},
    {"id": "acdrc", "n": "ACDRC – Advanced Chip Design Research Center", "short": "ACDRC", "kind": {"cs": "Česko-tchajwanské centrum pro výzkum a vzdělávání v návrhu čipů", "en": "Czech–Taiwanese centre for chip-design research and education"}, "lead": ["cybersecurityhub"], "leadNote": {"cs": "hlavní realizátor CyberSecurityHub CZ s VUT, ČVUT a MU; tchajwanský partner NIAR/NARLabs", "en": "run by CyberSecurityHub CZ with BUT, CTU and MU; Taiwanese partner NIAR/NARLabs"}, "url": "https://www.cybersecurityhub.cz/en/strategic-projects/acdrc", "li": "", "period": "2022–2026", "facts": {"cs": "Financováno z tchajwansko-českého plánu spolupráce pro odolnost dodavatelských řetězců a budování kapacit · dva pilíře: vzdělávání a výzkum · YouTube kanál s přednáškami", "en": "Funded under the Taiwan–Czech cooperation plan for supply-chain resilience and capacity building · two pillars: education and research · YouTube channel with lectures"}, "cs": "Letní a zimní školy návrhu integrovaných obvodů, pokročilé kurzy, stáže studentů v českém průmyslu a doktorandů na Tchaj-wanu, výukové materiály a osvěta pro střední školy. Výzkumná témata: bezpečnostní IC a hardwarové bezpečnostní moduly (PUF, postkvantová kryptografie), AI on chip (FPGA procesor pro automotive), nástroje pro automatizaci návrhu (EDA), biočipy a laserové zpracování SiC waferů.", "en": "Summer and winter schools of IC design, advanced courses, student internships in Czech industry and PhD internships in Taiwan, teaching materials and outreach to secondary schools. Research topics: security ICs and hardware security modules (PUF, post-quantum cryptography), AI on chip (an FPGA processor for automotive), design-automation tools (EDA), biochips and laser processing of SiC wafers.", "members": [{"n": "CyberSecurityHub CZ", "m": "cybersecurityhub", "role": {"cs": "hlavní realizátor", "en": "main execution unit"}}, {"n": "Vysoké učení technické v Brně", "m": "vut-brno"}, {"n": "ČVUT v Praze", "m": "cvut"}, {"n": "Masarykova univerzita", "m": "muni"}, {"n": "NIAR / NARLabs (Tchaj-wan)", "url": "https://www.narlabs.org.tw/en/"}, {"n": "TSRI – Taiwan Semiconductor Research Institute"}, {"n": "National Central University (Tchaj-wan)"}, {"n": "National Chung Hsing University (Tchaj-wan)"}, {"n": "Jmem Tek (Tchaj-wan)"}, {"n": "Codasip", "m": "codasip", "role": {"cs": "experti z průmyslu", "en": "industry experts"}}, {"n": "onsemi", "m": "onsemi", "role": {"cs": "experti z průmyslu", "en": "industry experts"}}, {"n": "STMicroelectronics", "m": "st", "role": {"cs": "experti z průmyslu", "en": "industry experts"}}], "src": [["CyberSecurityHub CZ: ACDRC", "https://www.cybersecurityhub.cz/en/strategic-projects/acdrc"], ["VUT: ACDRC – Chip Center to Strengthen Cooperation Between Czechia and Taiwan", "https://www.vut.cz/en/but/news-f19528/acdrc-chip-center-to-strengthen-cooperation-between-czechia-and-taiwan-d267218"]]}
  ],
  "news": [
    {"d": "2026-11-04", "a": false, "m": [], "c": ["csc"], "ty": "cluster", "src": "linkedin", "top": true, "cs": "V Bruselu byla 4. 11. oficiálně spuštěna EuroCDP – evropská platforma pro návrh čipů (Chips JU, iniciativa Chips for Europe), která má start-upům, MSP a výzkumným organizacím zpřístupnit nástroje, IP a know-how pro návrh čipů; Czech Semiconductor Centre na slavnostním zahájení zastupoval Jan Pleskač z CNSC.", "en": "EuroCDP – the EU Chips Design Platform (Chips JU, Chips for Europe Initiative) – was officially launched in Brussels on 4 Nov to give start-ups, SMEs and research organisations access to chip-design tools, IP and expertise; Jan Pleskač of CNSC represented the Czech Semiconductor Centre at the launch.", "u": "https://www.linkedin.com/company/czech-semiconductor-centre/posts/"},
    {"d": "2026-11-06", "a": false, "m": ["cybersecurityhub", "vut-brno", "uk"], "c": ["acdrc"], "ty": "event", "src": "web", "top": true, "cs": "Centra ACDRC a SCRC zvou 3. 12. do Kaiserštejnského paláce v Praze na konferenci „The Bridge to Sustainable and Resilient Semiconductor Ecosystem“ s českými a tchajwanskými partnery: úvod ředitelů Jiřího Házeho (ACDRC, VUT) a Davida Emlera (SCRC, UK), vystoupení Michala Lorence (CNSC) a Wen-Ling Tu (NCCU Taipei), prezentace mladých výzkumníků a panel o dobré praxi.", "en": "The ACDRC and SCRC centres invite to the conference “The Bridge to Sustainable and Resilient Semiconductor Ecosystem” on 3 Dec at Kaiserstein Palace, Prague, with Czech and Taiwanese partners: opening by directors Jiří Háze (ACDRC, BUT) and David Emler (SCRC, Charles University), talks by Michal Lorenc (CNSC) and Wen-Ling Tu (NCCU Taipei), young researchers' presentations and a lessons-learned panel.", "u": "https://www.cybersecurityhub.cz/en/news/articles/the-bridge-to-sustainable-and-resilient-semiconductor-ecosystem"},
    {"d": "2026-11-06", "a": false, "m": ["tropic-square"], "ty": "event", "src": "linkedin", "top": true, "cs": "Tropic Square představil na konferenci CHES 2026 výsledky fault-injection testů secure elementu TROPIC01: Ondřej Staníček přednesl s Lennertem Woutersem (KU Leuven) zvanou přednášku „Open Samples, Open Findings“ a Jan Bělohoubek vystoupil v panelu workshopu; několik laboratoří nabídlo vlastní nezávislé evaluace čipu.", "en": "Tropic Square presented the fault-injection results of its TROPIC01 secure element at CHES 2026: Ondřej Staníček gave the invited talk “Open Samples, Open Findings” with Lennert Wouters (KU Leuven) and Jan Bělohoubek joined the workshop panel; several labs offered to run their own independent evaluations of the chip.", "u": "https://www.linkedin.com/company/tropic-square/posts/"},
    {"d": "2026-11-04", "a": false, "m": ["advacam"], "ty": "partner", "src": "linkedin", "top": true, "cs": "Sesterská firma Advacamu ADVASPACE Radiation Data podepsala během Czech Space Week memorandum o porozumění se společností Spacemanic: detekční technologie Advacam a nanosatelitní platformy Spacemanic mají společně poskytovat data o kosmickém počasí; navazují na červencový start družice MARINA s detektorem MiniPix SPACE na palubě.", "en": "Advacam's sister company ADVASPACE Radiation Data signed a memorandum of understanding with Spacemanic during Czech Space Week: Advacam's particle-detection technology and Spacemanic's nanosatellite platforms are to deliver space-weather data services together, building on the July launch of the MARINA satellite carrying a MiniPix SPACE detector.", "u": "https://www.linkedin.com/company/widepix-s-r-o-/posts/"},
    {"d": "2026-11-06", "a": false, "m": ["onsemi"], "c": ["csc"], "ty": "event", "src": "linkedin", "top": false, "cs": "Czech Semiconductor Centre bylo hlavním partnerem Dnů AI 2026: na zahájení 2. 11. na Hvězdárně a planetáriu Brno vystoupili ředitel CSC Petr Kamenický a Karel Masařík, vedoucí RISC-V Center of Excellence v brněnském design centru onsemi, s přednáškou o čipech pro edge AI, energetické náročnosti výpočtů a roli otevřeného standardu RISC-V.", "en": "The Czech Semiconductor Centre was a main partner of AI Days 2026: at the opening on 2 Nov at the Brno Observatory and Planetarium, CSC director Petr Kamenický and Karel Masařík, head of the RISC-V Center of Excellence at onsemi's Brno design centre, spoke on chips for edge AI, the energy cost of computing and the role of the open RISC-V standard.", "u": "https://www.linkedin.com/showcase/onsemi-czechia/posts/"},
    {"d": "2026-11-02", "a": false, "m": ["cvut"], "ty": "partner", "src": "linkedin", "top": true, "cs": "ČVUT podepsalo v Bruselu dohodu o vstupu do aliance EuroTech Universities (TU München, Technion, EPFL, École polytechnique, DTU a další); spolu s estonským TalTechem se stane členem od 1. 1. 2027.", "en": "CTU Prague signed in Brussels the agreement to join the EuroTech Universities Alliance (TU Munich, Technion, EPFL, École polytechnique, DTU and others); together with Estonia's TalTech it becomes a member on 1 Jan 2027.", "u": "https://www.linkedin.com/school/cvutpraha/posts/"},
    {"d": "2026-11-06", "a": false, "m": ["vsb-tuo"], "ty": "invest", "src": "linkedin", "top": true, "cs": "IT4Innovations na VŠB-TUO slavnostně uvedlo do provozu superpočítač Barbora NG za 91 mil. Kč: 144 uzlů s 27 648 jádry (procesory Intel Xeon 6952P, 768 GB paměti na uzel, síť InfiniBand NDR, přímé kapalinové chlazení), šestinásobný výkon oproti původní Barboře; kapacity jsou dostupné výzkumným institucím přes granty a firmám formou pronájmu nebo smluvního výzkumu.", "en": "IT4Innovations at VSB-TUO inaugurated the Barbora NG supercomputer (CZK 91 million): 144 nodes with 27,648 cores (Intel Xeon 6952P, 768 GB per node, InfiniBand NDR, direct liquid cooling), six times the performance of the original Barbora; capacity is available to research institutions through grants and to companies via rental or contract research.", "u": "https://www.linkedin.com/school/vsb-technical-university-of-ostrava/posts/"},
    {"d": "2026-11-02", "a": false, "m": ["vsb-tuo"], "ty": "project", "src": "linkedin", "top": false, "cs": "Radek Zbořil z Centra nanotechnologií CEET VŠB-TUO získal grant EXPRO GA ČR (~50 mil. Kč na pět let) na projekt CHEMATECH o atomárním inženýrství pro třetí generaci nanotechnologií (úspornější chemická výroba, přeměna CO2, boj s rezistentními bakteriemi).", "en": "Radek Zbořil of the CEET Nanotechnology Centre at VSB-TUO won a Czech Science Foundation EXPRO grant (~CZK 50 million over five years) for CHEMATECH, a project on atomic engineering for third-generation nanotechnologies (energy-saving chemical production, CO2 conversion, fighting resistant bacteria).", "u": "https://www.linkedin.com/school/vsb-technical-university-of-ostrava/posts/"},
    {"d": "2026-11-03", "a": false, "m": ["vut-brno", "ceitec"], "ty": "event", "src": "linkedin", "top": false, "cs": "VUT je spolupořadatelem Czech Space Week 2026: na zahájení byla představena křišťálová kostka pro misi Aleše Svobody na ISS, do níž tým CEITEC Nano zapsal dvoufotonovým 3D tiskem (čáry 1 µm) dokumentaci studentské družice KOSTKA týmu YSpace z FEKT; děkan FEKT Jaroslav Koton vystoupil na Space2Business v panelu o budoucnosti vzdělávání v oblasti space.", "en": "BUT co-organises Czech Space Week 2026: the opening unveiled a crystal cube for Aleš Svoboda's ISS mission on which the CEITEC Nano team wrote the documentation of the FEEC student satellite KOSTKA (YSpace team) by two-photon 3D printing with 1 µm lines; FEEC dean Jaroslav Koton spoke at Space2Business on the future of space education.", "u": "https://www.linkedin.com/company/fektvut/posts/"},
    {"d": "2026-11-02", "a": false, "m": ["vut-brno"], "ty": "event", "src": "linkedin", "top": false, "cs": "VUT otevřelo přihlášky na akademický rok 2027/28: FEKT a Ústav mikroelektroniky nabízejí bakalářský program Mikroelektronika a technologie a bakalářský i navazující program Návrh čipů a moderní polovodičové technologie (u bakaláře možnost prominutí přijímaček), nově také odborné kurzy s mikrocertifikátem; dny otevřených dveří FEKT 27. 11. 2026, 15. 1. a 12. 2. 2027.", "en": "BUT opened applications for 2027/28: FEEC and the Department of Microelectronics offer the bachelor's programme Microelectronics and Technology and the bachelor's and master's Chip Design and Modern Semiconductor Technologies (entrance exam waivers for bachelor's), plus new micro-credential courses; FEEC open days on 27 Nov 2026, 15 Jan and 12 Feb 2027.", "u": "https://www.linkedin.com/company/umel-fekt-vut/posts/"},
    {"d": "2026-11-04", "a": false, "m": ["vut-brno"], "ty": "event", "src": "linkedin", "top": false, "cs": "FEKT VUT na Smart City Expo World Congress v Barceloně: tým Ústavu telekomunikací představil projekt 5G-SHARE (privátní sítě 5G s kvantově odolným propojením, s Vodafone) a prototyp řídicí jednotky Smart Multiplatform Controller vyvíjený s firmou LAMBERGA, vystavený na stánku Open Mobile Alliance.", "en": "FEEC BUT at the Smart City Expo World Congress in Barcelona: the Department of Telecommunications presented the 5G-SHARE project (private 5G networks with quantum-resistant interconnection, with Vodafone) and the Smart Multiplatform Controller prototype developed with LAMBERGA, shown at the Open Mobile Alliance stand.", "u": "https://www.linkedin.com/company/fektvut/posts/"},
    {"d": "2026-11-07", "a": false, "m": ["cvut"], "ty": "project", "src": "linkedin", "top": false, "cs": "ČVUT vybralo prvních pět projektů interního programu Interdisciplinary Near Future Challenge (z 32 přihlášek, financují Credo Ventures, Pale Fire Capital, WOOD & Company a nadace): mj. kvantové tečky pro novou generaci detektorů (FJFI + FEL), neuromorfní senzory pro sociální roboty a autonomní dron do 350 km/h.", "en": "CTU Prague selected the first five projects of its internal Interdisciplinary Near Future Challenge (from 32 applications, funded by Credo Ventures, Pale Fire Capital, WOOD & Company and foundations): among them quantum dots for next-generation detectors (FNSPE + FEE), neuromorphic sensing for social robots and a 350 km/h autonomous drone.", "u": "https://www.linkedin.com/school/cvutpraha/posts/"},
    {"d": "2026-11-05", "a": false, "m": ["asicentrum", "cvut"], "ty": "event", "src": "linkedin", "top": false, "cs": "ASICentrum hostilo exkurzi studentů FEL ČVUT: vedoucí vývoje Tomáš Novák představil firmu, Jakub Šťastný ukázal opravy již vyrobeného obvodu (metal fix), Martin Stahl svou diplomovou práci na SoC s RISC-V pro USI stylus a Jiří Nerad analogový návrh LC oscilátoru; následovala prohlídka laboratoří a vývoje embedded softwaru.", "en": "ASICentrum hosted an excursion of FEE CTU students: head of development Tomáš Novák introduced the company, Jakub Šťastný showed how a manufactured circuit is fixed (metal fix), Martin Stahl his thesis on a RISC-V SoC for a USI stylus and Jiří Nerad analog design of an LC oscillator, followed by a tour of the labs and embedded-software team.", "u": "https://www.linkedin.com/company/asicentrum/posts/"},
    {"d": "2026-11-04", "a": false, "m": ["dynanic"], "ty": "event", "src": "linkedin", "top": false, "cs": "DynaNIC chystá dvě listopadová dema: na SC26 v Chicagu (17.–19. 11., stánek Altera 2854) živé 400G Ultra Ethernet RDMA na FPGA Agilex 7 (až 400 Gb/s na kartu, 10 MIOPS při 4 kB) a na SuriCon 2026 v Lisabonu (18.–19. 11., sponzor Community Advocate) Suricata Turbo s offloadem filtrování přes DPDK rte_flow a DPI akcelerací přímo v FPGA.", "en": "DynaNIC prepares two November demos: at SC26 in Chicago (17–19 Nov, Altera booth 2854) live 400G Ultra Ethernet RDMA on Agilex 7 FPGAs (up to 400 Gb/s per card, 10 MIOPS at 4 kB) and at SuriCon 2026 in Lisbon (18–19 Nov, Community Advocate sponsor) Suricata Turbo with DPDK rte_flow filter offload and DPI acceleration directly in the FPGA.", "u": "https://www.linkedin.com/company/dynanic/posts/"},
    {"d": "2026-11-05", "a": false, "m": ["argotech"], "ty": "event", "src": "linkedin", "top": false, "cs": "Argotech vystavuje 11.–12. 11. na konferenci ROBUSTA 2026 (pokročilé laserové aplikace, HiLASE, Dolní Břežany); na místě Martin Tůma a Daniel Švanda.", "en": "Argotech exhibits at ROBUSTA 2026 (advanced laser applications, HiLASE, Dolní Břežany) on 11–12 Nov, represented by Martin Tůma and Daniel Švanda.", "u": "https://www.linkedin.com/company/argotech-semiconductor-photonics/posts/"},
    {"d": "2026-11-05", "a": false, "m": ["ep-roznov"], "c": ["csc"], "ty": "event", "src": "linkedin", "top": false, "cs": "Na SEMICON Europa 2026 (Mnichov, 10.–13. 11.) zvou na stánek MPO v hale C1 (C1401) EP Rožnov i Czech Semiconductor Centre, jehož ředitel Petr Kamenický tam bude k dispozici zájemcům o návrh čipů, přístup k evropským pilotním linkám a přeshraniční spolupráci.", "en": "At SEMICON Europa 2026 (Munich, 10–13 Nov) both EP Rožnov and the Czech Semiconductor Centre invite visitors to the Ministry of Industry and Trade stand in Hall C1 (C1401), where CSC director Petr Kamenický will meet companies interested in chip design, access to European pilot lines and cross-border cooperation.", "u": "https://www.linkedin.com/company/ep-roznov-a-s/posts/"},
    {"d": "2026-11-06", "a": false, "m": ["streicher", "zcu"], "ty": "event", "src": "linkedin", "top": false, "cs": "CTO STREICHERu Emil Černý přednášel studentům Fakulty strojní ZČU v předmětu Systémové navrhování technických produktů o specifikách návrhu vakuových zařízení (funkční a orgánové struktury, předběžné konstrukční struktury).", "en": "STREICHER CTO Emil Černý lectured to students of the Faculty of Mechanical Engineering at UWB in the Systems Design of Technical Products course on what makes vacuum-equipment design specific (functional and organ structures, preliminary constructional structures).", "u": "https://www.linkedin.com/company/streicher-spol-s-r-o-plze%C5%88/posts/"},
    {"d": "2026-11-04", "a": false, "m": ["tescan", "ceitec"], "ty": "event", "src": "linkedin", "top": false, "cs": "Tescan zve na EBSD Workshop 26.–27. 11. v CEITEC VUT (pořádají AMETEK, Gatan a EDAX), kde Jiří Dluhoš představí multimodální 3D charakterizaci materiálů na plazmovém FIB-SEM AMBER X 2; 25. 11. následuje online webinář o tom, jak CEITEC Nano slouží materiálovému výzkumu.", "en": "Tescan invites to the EBSD Workshop on 26–27 Nov at CEITEC BUT (organised by AMETEK, Gatan and EDAX), where Jiří Dluhoš presents multimodal 3D materials characterisation on the AMBER X 2 plasma FIB-SEM; an online webinar on how CEITEC Nano serves materials research follows on 25 Nov.", "u": "https://www.linkedin.com/company/tescan-group/posts/"},

    `<button data-k="${k}" data-v="${v}" aria-pressed="${on}"${cnt === 0 && !on ? ' disabled' : ''} style="${on && style ? style : ''}">${label} <span class="n">${cnt}</span></button>`;
  fl.innerHTML = btn('all', '', !F.ty && !F.seg, esc(t.all), sorted.length) +
    `<span class="lb">${esc(t.fType)}</span>` +
    D.types.map(x => btn('ty', x.id, F.ty === x.id, esc(L(x)), cntTy(x.id))).join('') +
    `<span class="sep"></span><span class="lb">${esc(t.fSeg)}</span>` +
    D.segments.map(s => btn('seg', s.id, F.seg === s.id, `${esc(s.code)} ${esc(L(s))}`, cntSeg(s.id), `background:${segColor(s.id)};border-color:${segColor(s.id)}`)).join('');
  fl.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v;
    if (k === 'all') F = {ty: null, seg: null}; else F[k] = (F[k] === v) ? null : v;
    renderNews();
  });
  const list = sorted.filter(n => inTy(n, F.ty) && inSeg(n, F.seg));
  const active = [F.ty && L(D.types.find(x => x.id === F.ty)), F.seg && L(D.segments.find(s => s.id === F.seg))].filter(Boolean);
  const nw = list.length === 1 ? t.items1 : (list.length >= 2 && list.length <= 4 ? t.items2 : t.items);
  $('newsCount').innerHTML = `${list.length} ${esc(nw)}` + (active.length ? ` · ${esc(t.filter)}: <b>${active.map(esc).join(' × ')}</b> · <a href="#" data-clear>${esc(t.clear)}</a>` : '');
  const cl = $('newsCount').querySelector('[data-clear]'); if (cl) cl.onclick = e => { e.preventDefault(); F = {ty: null, seg: null}; renderNews(); };
  $('newsList').innerHTML = list.length ? list.map(itemHTML).join('') : `<p class="empty">${esc(t.noitems)}</p>`;
  bindGo($('newsList'));
}

// Member offer: o.tech / o.srv come from the cluster's Technology & Service Mapping (original wording),
// o.cs / o.en bullets and o.train{cs,en} from the member's public website and semicz.cz profile.
const hasTraining = m => { const o = m.offer; if (!o) return false; if (o.train && (o.train.cs || o.train.en)) return true; return (o.srv || []).some(([k]) => /training/i.test(k)); };
function offerHTML(m) {
  const t = T(), o = m.offer;
  if (!o) return '';
  const bullets = L({cs: o.cs, en: o.en});
  let h = '';
  if (Array.isArray(bullets) && bullets.length) h += `<div><h5>${esc(t.oWhat)}</h5><ul>${bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>`;
  if (o.train && (o.train.cs || o.train.en)) h += `<div class="train">🎓 <b>${esc(t.oTrain)}:</b> ${esc(L(o.train))}</div>`;
  if (o.tech && o.tech.length) h += `<div><h5>${esc(t.oTech)}</h5>${o.tech.map(([k, v]) => `<div class="oi"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>`;
  if (o.srv && o.srv.length) h += `<div><h5>${esc(t.oSrv)}</h5>${o.srv.map(([k, v]) => `<div class="oi"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>`;
  if (!h) h = `<div class="fine">${esc(t.oNone)}</div>`;
  const src = [o.tech || o.srv ? t.srcTsm : null, (Array.isArray(bullets) && bullets.length) || (o.train && (o.train.cs || o.train.en)) ? t.srcWeb : null].filter(Boolean).join(' · ');
  return `<details class="offer"><summary>${esc(t.offer)}</summary><div class="ob">${h}<div class="osrc">${esc(src)}</div></div></details>`;
}

function renderRadar() {
  const t = T();
  const W = 1180, H = 770, C = W / 2, CY = 385, R = [0, 210, 342];
  const segs = D.segments;
  const counts = Object.fromEntries(segs.map(s => [s.id, D.members.filter(m => m.s === s.id).length]));
  const tot = segs.reduce((a, s) => a + Math.max(2, counts[s.id]), 0);
  let ang = -Math.PI / 2; const span = {};
  segs.forEach(s => { const w = Math.max(2, counts[s.id]) / tot * 2 * Math.PI; span[s.id] = [ang, ang + w]; ang += w; });
  let h = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.radarH)}">`;
  for (let i = 2; i >= 1; i--) h += `<circle cx="${C}" cy="${CY}" r="${R[i]}" fill="${i % 2 ? '#141a24' : '#0f141d'}" stroke="#2a3344" stroke-width="1.5"/>`;
  segs.forEach(s => {
    const [a0, a1] = span[s.id];
    h += `<line x1="${C}" y1="${CY}" x2="${(C + R[2] * Math.cos(a0)).toFixed(1)}" y2="${(CY + R[2] * Math.sin(a0)).toFixed(1)}" stroke="#2a3344" stroke-width="1.5"/>`;
    const m = (a0 + a1) / 2, lr = R[2] + 18, x = C + lr * Math.cos(m), y = CY + lr * Math.sin(m);
    const anc = Math.abs(Math.cos(m)) < .25 ? 'middle' : (Math.cos(m) > 0 ? 'start' : 'end'); const yoff = Math.abs(Math.cos(m)) < .25 ? (Math.sin(m) < 0 ? -8 : 18) : 6;
    h += `<text x="${x.toFixed(1)}" y="${(y + yoff).toFixed(1)}" text-anchor="${anc}" font-size="16" font-weight="700" fill="${segColor(s.id)}" font-family="Space Grotesk,Inter,sans-serif">${esc(s.code)} ${esc(L(s))}</text>`;
  });
  for (let i = 1; i <= 2; i++) h += `<text x="${C + 6}" y="${CY - R[i] + 16}" font-size="13" fill="#5d6677" font-family="IBM Plex Mono,monospace">${i}</text>`;
  const dots = [];
  segs.forEach(s => {
    const ms = D.members.filter(m => m.s === s.id);
    const byRing = {1:[],2:[]};
    ms.forEach(m => { const r = ringOf(m.id); if (r <= 2) byRing[r].push(m); });
    const [a0, a1] = span[s.id];
    Object.entries(byRing).forEach(([ring, arr]) => {
      arr.forEach((m, i) => {
        const k = arr.length, a = a0 + (a1 - a0) * (i + 1) / (k + 1);
        // stagger radius inside the ring so dense rings do not overlap
        const r0 = R[ring - 1], r1 = R[ring];
        let frac = 0.55;
        if (ring == 1) frac = k > 3 ? [0.38, 0.66, 0.94][i % 3] : k > 1 ? (i % 2 ? 0.9 : 0.55) : 0.72;
        else if (k > 3) frac = 0.28 + 0.56 * ((i % 3) / 2);
        else if (k > 1) frac = i % 2 ? 0.72 : 0.4;
        const r = r0 + (r1 - r0) * frac;
        dots.push({m, ring: +ring, x: C + r * Math.cos(a), y: CY + r * Math.sin(a), s});
      });
    });
  });
  // labels: horizontal text next to the dot; overlapping labels are nudged apart vertically (same side, overlapping x-range)
  const labels = dots.map(d => { const right = Math.cos(Math.atan2(d.y - CY, d.x - C)) >= 0; const w = d.m.short.length * 7.8 + 6; return {d, right, x: d.x + (right ? 12 : -12), y: d.y + 5, w, h: 16}; });
  // other members' dots are fixed obstacles for a label (box around the dot, in label coordinates: y = baseline)
  const items = labels.concat(dots.map(d => ({d, fixed: true, x0: d.x - 10, x1: d.x + 10, y: d.y + 5, h: 20})));
  const xr = o => o.fixed ? [o.x0, o.x1] : (o.right ? [o.x, o.x + o.w] : [o.x - o.w, o.x]);
  for (let it = 0; it < 10; it++) {
    items.sort((p, q) => p.y - q.y);
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const A = items[i], B = items[j]; if (B.y - A.y >= Math.max(A.h, B.h)) break;
      if (A.fixed && B.fixed) continue;
      if (!A.fixed && !B.fixed && A.d === B.d) continue;
      if ((A.fixed && A.d === B.d) || (B.fixed && B.d === A.d)) continue;  // a label may sit next to its own dot
      const [ax0, ax1] = xr(A), [bx0, bx1] = xr(B);
      if (ax1 < bx0 || bx1 < ax0) continue;
      const need = (A.h + B.h) / 2 - (B.y - A.y) + 0.5;
      if (A.fixed) B.y += need; else if (B.fixed) A.y -= need; else { A.y -= need / 2; B.y += need / 2; }
    }
  }
  labels.forEach(l => {
    const d = l.d;
    h += `<g class="dot" data-id="${d.m.id}" style="cursor:pointer">`;
    if (Math.abs(l.y - (d.y + 5)) > 7) h += `<line x1="${d.x.toFixed(1)}" y1="${d.y.toFixed(1)}" x2="${(l.x + (l.right ? -3 : 3)).toFixed(1)}" y2="${(l.y - 4).toFixed(1)}" stroke="#5d6677" stroke-width="1"/>`;
    h += `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="8" fill="${segColor(d.s.id)}" stroke="#0d121a" stroke-width="2"/>`;
    h += `<text x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" text-anchor="${l.right ? 'start' : 'end'}" font-size="14" font-weight="600" fill="#eef1f6" font-family="Inter,sans-serif">${esc(d.m.short)}</text></g>`;
  });
  h += '</svg>';
  $('radarSvg').innerHTML = h;
  const tip = $('tip'), box = $('radarSvg');
  box.querySelectorAll('.dot').forEach(g => {
    const m = memById[g.dataset.id], n = last[m.id];
    g.addEventListener('mousemove', e => {
      const r = box.getBoundingClientRect();
      tip.style.display = 'block'; tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 270) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
      tip.innerHTML = `<b>${esc(m.n)}</b><span class="m">${esc(L(segById[m.s]))} · ${esc(m.city)}</span><div style="margin-top:4px">${n ? esc(fmt(n.d, n.a)) + ' · ' + esc(L({cs:n.cs,en:n.en})) : esc(T().nolast)}</div>`;
    });
    g.addEventListener('mouseleave', () => tip.style.display = 'none');
    g.addEventListener('click', () => { showTab('members'); const el = document.getElementById('member-' + m.id); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); });
  });
  const quietN = D.members.filter(m => ringOf(m.id) > 2).length;
  const levels = D.rings.filter(r => r.n <= 2).map(r => {
    const who = D.members.filter(m => ringOf(m.id) === r.n).map(m => m.short);
    const w = who.length ? who.join(', ') : `<span style="color:var(--faint)">${esc(t.none)}</span>`;
    return `<div class="rk" style="--c:${ringColor(r.n)}"><div class="n">${esc(t.level)} ${r.n} · ${esc(L({cs:r.desc_cs,en:r.desc_en}))}</div><div class="t">${esc(L(r))}</div><div class="w">${w}</div></div>`;
  }).join('');
  const seglist = segs.map(s => `<span style="--c:${segColor(s.id)}"><i></i>${esc(s.code)} ${esc(L(s))} (${counts[s.id]})</span>`).join('');
  $('key').innerHTML = levels + `<div class="rk legend" style="--c:var(--line)"><div class="n">${esc(t.legendH)}</div>` +
    t.legend.map(([k, v]) => `<div class="li"><b>${esc(k)}</b> ${esc(v)}</div>`).join('') +
    `<div class="li"><b>${esc(t.legendQuiet)}</b> ${quietN} ${esc(t.legendQuiet2)}</div><div class="seglist">${seglist}</div></div>`;
  $('seglist').innerHTML = '';
}

function renderCentres() {
  const t = T(), list = D.centres || [];
  $('centreList').innerHTML = list.map(c => {
    const leads = (c.lead || []).map(id => memById[id]).filter(Boolean);
    const leadH = leads.map(m => `<a href="#member-${m.id}" data-go="${m.id}">${esc(m.n)}</a>`).join(', ') + (c.leadNote ? ` <span class="ln">– ${esc(L(c.leadNote))}</span>` : '');
    const links = [c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(t.web)} ↗</a>` : '', c.li ? `<a href="https://www.linkedin.com/${esc(c.li)}/" target="_blank" rel="noopener">${esc(t.li)} ↗</a>` : '', c.newsletter ? `<a href="${esc(c.newsletter)}" target="_blank" rel="noopener">${esc(t.cenNl)} ↗</a>` : ''].filter(Boolean).join('');
    const nMem = (c.members || []).filter(x => x.m && memById[x.m]).length;
    const parts = (c.members || []).map(x => {
      const role = x.role ? ` <em>(${esc(L(x.role))})</em>` : '';
      if (x.m && memById[x.m]) { const m = memById[x.m]; return `<a class="cp m" href="#member-${m.id}" data-go="${m.id}" style="--c:${segColor(m.s)}"><i></i>${esc(x.n)}${role}</a>`; }
      return x.url ? `<a class="cp" href="${esc(x.url)}" target="_blank" rel="noopener"><i></i>${esc(x.n)}${role}</a>` : `<span class="cp"><i></i>${esc(x.n)}${role}</span>`;
    }).join('');
    const items = D.news.filter(n => (n.c || []).includes(c.id)).sort((a, b) => b.d.localeCompare(a.d));
    const latest = items.length ? itemHTML(items[0]) : `<p class="empty">${esc(t.cenNone)}</p>`;
    const srcs = (c.src || []).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(' · ');
    return `<article class="centre" id="centre-${c.id}">
      <div class="ch"><div><h3>${esc(c.n)}</h3><div class="kind">${esc(L(c.kind))}${c.period ? ` · ${esc(c.period)}` : ''}</div></div><div class="links">${links}</div></div>
      <div class="lead"><b>${esc(t.cenLead)}:</b> ${leadH}</div>
      <p>${esc(L({cs: c.cs, en: c.en}))}</p>
      ${c.facts ? `<div class="facts">${esc(L(c.facts))}</div>` : ''}
      <h4>${esc(t.cenPartners)} <span class="cnt">${(c.members || []).length} · ${nMem} ${esc(t.cenMembers)}</span></h4>
      <div class="parts">${parts}</div>
      <h4>${esc(t.cenLatest)}</h4>${latest}
      ${srcs ? `<div class="csrc">${esc(t.cenSrc)}: ${srcs}</div>` : ''}
    </article>`;
  }).join('');
  bindGo($('centreList'));
}
